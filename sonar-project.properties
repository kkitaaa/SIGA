sonar.projectKey=SIGA
sonar.host.url=https://sonarqube.inf.uct.cl
sonar.sources=backend/src
sonar.tests=backend/tests
sonar.test.inclusions=backend/tests/**/*.test.js
sonar.exclusions=**/node_modules/**, **/*.test.js, **/jest.config.js, **/vite.config.js, **/coverage/**, backend/src/generated/**, backend/src/docs/**, frontend/siga/src/**
sonar.coverage.exclusions=backend/src/generated/**, backend/src/docs/**, backend/src/config/**, backend/src/index.js
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
sonar.cobertura.reportPaths=backend/coverage/cobertura-coverage.xml